# Mutants for the JUNGFRAU WAXS pass (src/analysis/waxs). Each entry replaces
# `old` (which must occur exactly once in `file`) by `new` in a copy of src/ and
# runs `tests` against the copy. expect = "killed" (default): the tests must
# fail. expect = "survived": a known gap, listed so the fix flips it.

[[mutant]]
name = "waxs_position_is_cell_id"
file = "src/analysis/waxs/worker.py"
old = "            position = positions[cell]"
new = "            position = cell"
tests = [
    "tests/waxs/test_waxs_run.py::test_each_row_holds_the_frame_its_memory_cell_labels",
    "tests/waxs/test_waxs_real_frames.py::test_each_row_holds_the_real_frame_its_memory_cell_labels",
]

[[mutant]]
name = "waxs_policy_refuses_data_check_failed"
file = "src/analysis/waxs/config.py"
old = "return frozenset({FrameStatus.OK.name, FrameStatus.DATA_CHECK_FAILED.name})"
new = "return frozenset({FrameStatus.OK.name})"
tests = ["tests/waxs/test_waxs_run.py::test_a_fully_masked_frame_is_refused_counted_and_tolerated"]

[[mutant]]
name = "waxs_pass_ignores_policy"
file = "src/analysis/waxs/run.py"
old = "    tolerated = cfg.tolerated_statuses"
new = '    tolerated = {"OK", "DATA_CHECK_FAILED"}'
tests = ["tests/waxs/test_waxs_run.py::test_a_fully_masked_frame_is_refused_counted_and_tolerated"]

[[mutant]]
name = "waxs_damnit_reader_ignores_policy"
file = "src/analysis/waxs/damnit.py"
old = "    if set(summary) - cfg.tolerated_statuses:"
new = '    if set(summary) - {"OK"}:'
tests = ["tests/waxs/test_waxs_damnit.py::test_a_refused_frame_is_tolerated_everywhere_or_nowhere"]

[[mutant]]
name = "waxs_preprocess_colour_ignores_policy"
file = "src/analysis/waxs/damnit.py"
old = "        tolerated[detector] = cfg.tolerated_statuses"
new = '        tolerated[detector] = frozenset({"OK", "DATA_CHECK_FAILED"})'
tests = ["tests/waxs/test_waxs_damnit.py::test_a_refused_frame_is_tolerated_everywhere_or_nowhere"]

[[mutant]]
name = "waxs_dead_frame_stored_as_ok"
file = "src/analysis/waxs/worker.py"
old = "                result.status[row] = FrameStatus.DATA_CHECK_FAILED"
new = "                result.status[row] = FrameStatus.OK"
tests = ["tests/waxs/test_waxs_run.py::test_a_fully_masked_frame_is_refused_counted_and_tolerated"]

[[mutant]]
name = "waxs_measured_noise_beats_configured"
file = "src/analysis/waxs/run.py"
old = "    if cfg.read_noise_kev is not None:\n        return ErrorModel("
new = "    if cfg.read_noise_kev is not None and classification.read_noise_kev is None:\n        return ErrorModel("
tests = ["tests/waxs/test_waxs_run.py"]
expect = "survived"  # sigma_read enters no stored number; wave 3 deletes the error model

[[mutant]]
name = "waxs_modules_present_empty"
