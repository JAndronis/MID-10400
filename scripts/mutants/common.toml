# Mutants for the common layer. Each entry replaces `old` (which must occur exactly
# once in `file`) by `new` in a copy of src/ and runs `tests` against the copy.
# expect = "killed" (default): the tests must fail. expect = "survived": a known gap,
# which stays listed so the fix that closes it flips the entry to killed, or a
# harmless change that a test must not fire on.

