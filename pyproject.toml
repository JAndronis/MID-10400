[project]
name = "MID-10400-analysis"
version = "0.1.0"
description = "EuXFEL MID (proposal 10400) raw-data reader plugin for pyBeamtime — ferritin crystallization in acoustically levitated droplets."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pybeamtime",
    "xarray",
]

[project.optional-dependencies]
# EuXFEL I/O stack. Needed only by EuXFELMIDRawReader.load_run (Tier 1 assembly)
# and, later, the Tier-2 adapters — all of which run on Maxwell against real
# data. Kept as an optional extra so the pure path helpers, can_read, and
# list_runs stay importable and unit-testable without EXtra-data installed.
euxfel = [
    "euxfel-extra",
    "extra_data",
    "extra_geom",
    # Required by analysis.saxs (operator + self-test). Previously present only
    # transitively, via extra-speckle and damnit.
    "pyfai",
    "extra_proposal",
    "extra-speckle",
    "dask[complete]",
    "dask_jobqueue",
    "matplotlib<3.9",
    "ipympl",
    "scikit-image",
    "damnit"
]

[dependency-groups]
dev = [
    "isal>=1.8.0",
    "pytest>=8",
    "zlib-into>=0.4",
]

[tool.uv.sources]
# pyBeamtime is developed locally; consume it as an editable path dependency so
# reader changes here can be upstreamed into its io/readers/ package later.
pybeamtime = { path = "./extern/pybeamtime", editable = true }
extra-speckle = { git = "https://git.xfel.eu/dataAnalysis/extra-speckle.git" }
pixel-masker = { git = "https://git.xfel.eu/leonaual/pixel-masker.git" }
damnit = { git = "https://github.com/European-XFEL/DAMNIT.git" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/readers", "src/analysis"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["notebooks", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# DAMNIT context-file variable dependencies are declared as quoted
# "meta#..."/"var#..."/"mymdc#..." annotations, DAMNIT's own dependency-
# injection syntax rather than real (or forward-referenced) type hints. Ruff
# parses the quoted annotation as an expression and reports the part before
# "#" (which starts a Python comment) as an undefined name.
"src/amore/context.py" = ["F821"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: requires extra_data + real EuXFEL data (skipped when unavailable)",
]
